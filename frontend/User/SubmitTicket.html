<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TicketFlow — Submit ticket</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/user.css">
    <script src="../js/authGuard.js"></script>
</head>

<body>
    <div style="min-height:100vh;box-sizing:border-box;background:#F7F7F5;display:flex;flex-direction:column;">

        <!-- Nav -->
        <div
            style="display:flex;align-items:center;justify-content:space-between;padding:20px 56px;background:#FFFFFF;border-bottom:1px solid #E3E3DD;flex-wrap:wrap;gap:16px;">
            <div style="display:flex;align-items:center;gap:48px;flex-wrap:wrap;">
                <a href="TicketHistory.html" style="display:flex;align-items:center;gap:10px;">
                    <span
                        style="width:30px;height:30px;border-radius:8px;background:#3454D1;display:flex;align-items:center;justify-content:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </span>
                    <span
                        style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;">TicketFlow</span>
                </a>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a href="SubmitTicket.html"
                        style="font-size:14px;font-weight:600;color:#3454D1;background:#EAEEFB;padding:9px 16px;border-radius:8px;">Submit
                        ticket</a>
                    <a href="TicketHistory.html"
                        style="font-size:14px;font-weight:600;color:#4B4E57;padding:9px 16px;border-radius:8px;">My
                        tickets</a>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span id="userInitials"
                    style="width:36px;height:36px;border-radius:999px;background:#EAEEFB;color:#3454D1;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;">AR</span>
                <div style="display:flex;flex-direction:column;line-height:1.3;">
                    <span id="userName" style="font-size:13px;font-weight:600;">Alex Rivera</span>
                    <span style="font-size:12px;color:#8A8D97;">Customer</span>
                </div>
                <button onclick="handleLogout()"
                    style="background:none;border:none;font-size:13px;font-weight:600;color:#B23131;padding:8px 12px;border-radius:8px;">Log
                    out</button>
            </div>
        </div>

        <!-- Content -->
        <div style="padding:40px 56px;display:flex;flex-direction:column;gap:24px;flex-grow:1;">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <h1 style="font-size:26px;font-weight:700;">Submit a ticket</h1>
                <p style="font-size:14px;color:#4B4E57;">Describe the issue and we'll route it to the right team.</p>
            </div>
            <div class="form-card">
                <form style="display:flex;flex-direction:column;gap:18px;" onsubmit="handleSubmitTicket(event)">
                    <div class="form-field">
                        <label for="title" class="form-label">Subject</label>
                        <input id="title" name="title" type="text" class="form-input"
                            placeholder="Briefly describe the issue">
                    </div>
                    <div class="form-field-row">
                        <div class="form-field">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" name="category" class="form-select">
                                <option>Billing</option>
                                <option>Technical</option>
                                <option>Account</option>
                                <option>Feature request</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="priority" class="form-label">Priority</label>
                            <select id="priority" name="priority" class="form-select">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" class="form-textarea"
                            placeholder="Include any steps to reproduce, error messages, or screenshots links"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="align-self:flex-start;padding:14px 30px;">Submit
                        ticket</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script>
    function toMySQLDateTime(date) {
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
            `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function handleLogout() {
        localStorage.removeItem('ticketflow_user');
        window.location.href = '../Login.html';
    }
    function displayUserInfor() {
        const user_infor = JSON.parse(localStorage.getItem('ticketflow_user'));
        document.getElementById('userName').textContent = user_infor.username;
        const initials = user_infor.username
            .split(' ')
            .map(word => word[0])
            .join('')
            .toUpperCase()
            .slice(0, 2);
        document.getElementById('userInitials').textContent = initials;
    }
    displayUserInfor();
    function handleSubmitTicket(event) {
        event.preventDefault();

        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const priority = document.getElementById('priority').value;
        const description = document.getElementById('description').value;
        const user_id = JSON.parse(localStorage.getItem('ticketflow_user')).user_id;
        let deadline;
        let sla_due_at = new Date();
        // set deadline based on the priority selected
        if (priority === 'critical') {
            deadline = 2;
            alert('Critical priority tickets have a deadline of 2 days.');
        } else if (priority === 'high') {
            deadline = 5;
            alert('High priority tickets have a deadline of 5 days.');
        } else if (priority === 'medium') {
            deadline = 10;
            alert('Medium priority tickets have a deadline of 10 days.');
        } else if (priority === 'low') {
            deadline = 15;
            alert('Low priority tickets have a deadline of 15 days.');
        } else {
            alert('Invalid priority selected.');
            return;
        }
        // set the SLA due date based on the priority selected
        sla_due_at.setDate(sla_due_at.getDate() + deadline);

        const ticketData = {
            title,
            user_id,
            description,
            priority,
            category,
            sla_due_at: toMySQLDateTime(sla_due_at)
        };

        fetch('http://ticketflow-env.eba-gamu7nvf.ap-southeast-1.elasticbeanstalk.com/tickets/create-tickets', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(ticketData)
        })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    alert(data.error || 'Failed to submit ticket.');
                    return;
                }
                console.log('Ticket submitted successfully:', data);
                window.location.href = 'TicketHistory.html';
            })
            .catch(error => {
                console.error('Error submitting ticket:', error);
            });
    }
</script>

</html>
