<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TicketFlow — My tickets</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/user.css">
    <script src="../js/authGuard.js"></script>
</head>

<body>
    <div style="min-height:100vh;box-sizing:border-box;background:#F7F7F5;display:flex;flex-direction:column;">

        <!-- Nav -->
        <div
            style="display:flex;align-items:center;justify-content:space-between;padding:20px 56px;background:#FFFFFF;border-bottom:1px solid #E3E3DD;flex-wrap:wrap;gap:16px;">
            <div style="display:flex;align-items:center;gap:48px;flex-wrap:wrap;">
                <a href="TicketHistory.html" style="display:flex;align-items:center;gap:10px;">
                    <span
                        style="width:30px;height:30px;border-radius:8px;background:#3454D1;display:flex;align-items:center;justify-content:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </span>
                    <span
                        style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;">TicketFlow</span>
                </a>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a href="SubmitTicket.html"
                        style="font-size:14px;font-weight:600;color:#4B4E57;padding:9px 16px;border-radius:8px;">Submit
                        ticket</a>
                    <a href="TicketHistory.html"
                        style="font-size:14px;font-weight:600;color:#3454D1;background:#EAEEFB;padding:9px 16px;border-radius:8px;">My
                        tickets</a>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span id="userInitials"
                    style="width:36px;height:36px;border-radius:999px;background:#EAEEFB;color:#3454D1;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;">AR</span>
                <div style="display:flex;flex-direction:column;line-height:1.3;">
                    <span id="userName" style="font-size:13px;font-weight:600;">Alex Rivera</span>
                    <span style="font-size:12px;color:#8A8D97;">Customer</span>
                </div>
                <button onclick="handleLogout()"
                    style="background:none;border:none;font-size:13px;font-weight:600;color:#B23131;padding:8px 12px;border-radius:8px;">Log
                    out</button>
            </div>
        </div>

        <!-- Content -->
        <div style="padding:40px 56px;display:flex;flex-direction:column;gap:24px;flex-grow:1;">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
                <div style="display:flex;flex-direction:column;gap:6px;">
                    <h1 style="font-size:26px;font-weight:700;">My tickets</h1>
                    <p style="font-size:14px;color:#4B4E57;">Track the status of everything you've submitted.</p>
                </div>
                <a href="SubmitTicket.html"
                    style="background:#3454D1;color:#FFFFFF;font-size:14px;font-weight:600;padding:12px 20px;border-radius:9px;">+
                    New ticket</a>
            </div>

            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div
                    style="flex-grow:1;display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #CBCBC2;border-radius:9px;padding:0 14px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="M21 21l-4.3-4.3"></path>
                    </svg>
                    <input type="text" placeholder="Search your tickets"
                        style="border:none;padding:11px 0;font-size:14px;flex-grow:1;">
                </div>
                <select
                    style="padding:0 14px;border-radius:9px;border:1px solid #CBCBC2;font-size:14px;background:#FFFFFF;">
                    <option>All statuses</option>
                    <option>Open</option>
                    <option>In progress</option>
                    <option>Resolved</option>
                    <option>Closed</option>
                </select>
            </div>

            <div style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:16px;overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Submitted</th>
                            <th>Task Deadline</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
<script>
    function handleLogout() {
        localStorage.removeItem('ticketflow_user');
        window.location.href = '../Login.html';
    }
    function displayUserInfor() {
        const user_infor = JSON.parse(localStorage.getItem('ticketflow_user'));
        document.getElementById('userName').textContent = user_infor.username;
        const initials = user_infor.username
            .split(' ')
            .map(word => word[0])
            .join('')
            .toUpperCase()
            .slice(0, 2);
        document.getElementById('userInitials').textContent = initials;
    }
    displayUserInfor();

    function getAllTickets() {
        const storedUser = JSON.parse(localStorage.getItem('ticketflow_user'));
        if (!storedUser) return;
        const user_id = storedUser.user_id;
        fetch(`http://ticketflow-env.eba-gamu7nvf.ap-southeast-1.elasticbeanstalk.com/tickets/get-tickets?user_id=${user_id}`)
            .then(response => response.json())
            .then(data => {
                const tickets = data.tickets;
                const tbody = document.querySelector('tbody');
                tbody.innerHTML = ''; // Clear existing rows

                tickets.forEach(ticket => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td><span class="ticket-subject">${ticket.title}</span><br><span class="ticket-id">TF-${ticket.ticket_id}</span></td>
                        <td style="color:#4B4E57;">${ticket.category}</td>
                        <td><span class="pill" style="background:#FBEEDD;color:#8A4B07;">${ticket.priority}</span></td>
                        <td><span class="pill" style="background:#E4F4EA;color:#1B7A43;">${ticket.status}</span></td>
                        <td style="color:#4B4E57;">${new Date(ticket.created_at).toLocaleDateString()}</td>
                        <td style="color:#4B4E57;">${ticket.sla_due_at ? new Date(ticket.sla_due_at).toLocaleDateString() : '—'}</td>
                    `;

                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching tickets:', error));
    }
    getAllTickets();
</script>

</html>
