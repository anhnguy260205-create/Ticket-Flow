<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TicketFlow — Admin: staff and customer management</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/authGuard.js"></script>
</head>

<body>
    <div style="min-height:100vh;box-sizing:border-box;background:#F7F7F5;display:flex;flex-direction:column;">

        <!-- Nav -->
        <div
            style="display:flex;align-items:center;justify-content:space-between;padding:20px 56px;background:#FFFFFF;border-bottom:1px solid #E3E3DD;flex-wrap:wrap;gap:16px;">
            <div style="display:flex;align-items:center;gap:48px;flex-wrap:wrap;">
                <a href="Dashboard.html" style="display:flex;align-items:center;gap:10px;">
                    <span
                        style="width:30px;height:30px;border-radius:8px;background:#3454D1;display:flex;align-items:center;justify-content:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </span>
                    <span
                        style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;">TicketFlow</span>
                </a>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a href="Dashboard.html"
                        style="font-size:14px;font-weight:600;color:#4B4E57;padding:9px 16px;border-radius:8px;">All
                        tickets</a>
                    <a href="StaffManagement.html"
                        style="font-size:14px;font-weight:600;color:#3454D1;background:#EAEEFB;padding:9px 16px;border-radius:8px;">Staff</a>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span id="userInitials"
                    style="width:36px;height:36px;border-radius:999px;background:#3454D1;color:#FFFFFF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;">MP</span>
                <div style="display:flex;flex-direction:column;line-height:1.3;">
                    <span id="userName" style="font-size:13px;font-weight:600;">Morgan Patel</span>
                    <span style="font-size:12px;color:#8A8D97;">Admin</span>
                </div>
                <button onclick="handleLogout()"
                    style="background:none;border:none;font-size:13px;font-weight:600;color:#B23131;padding:8px 12px;border-radius:8px;">Log
                    out</button>
            </div>
        </div>

        <!-- Content -->
        <div style="padding:36px 56px;display:flex;flex-direction:column;gap:22px;flex-grow:1;">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <h1 style="font-size:26px;font-weight:700;">Staff And Customer Management</h1>
                <p style="font-size:14px;color:#4B4E57;">Manage and monitor your team members and clients.
                </p>
            </div>

            <!-- Stats -->
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;">
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Total members</span>
                    <span id="stat-total"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#3454D1;"></span>
                </div>

                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Staff</span>
                    <span id="stat-staff"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#8A4B07;"></span>
                </div>
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Customers</span>
                    <span id="stat-users"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#1B7A43;"></span>
                </div>
            </div>

            <!-- Filters -->
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div
                    style="flex-grow:1;display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #CBCBC2;border-radius:9px;padding:0 14px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="M21 21l-4.3-4.3"></path>
                    </svg>
                    <input id="staff-search" type="text" placeholder="Search by name or email"
                        style="border:none;padding:11px 0;font-size:14px;flex-grow:1;">
                </div>
                <select id="role-filter"
                    style="padding:0 14px;border-radius:9px;border:1px solid #CBCBC2;font-size:14px;background:#FFFFFF;">
                    <option value="">All roles</option>
                    <option value="staff">Staff</option>
                    <option value="user">Customer</option>
                </select>
            </div>

            <!-- Table -->
            <div style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:16px;overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Number of Tasks</th>
                            <th>Staff Code</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
<script>
    function handleLogout() {
        localStorage.removeItem('ticketflow_user');
        window.location.href = '../Login.html';
    }
    function displayInfor() {
        const infor = JSON.parse(localStorage.getItem('ticketflow_user'));
        document.getElementById('userName').textContent = infor.username
        const initials = infor.username.split(' ').map(word => word[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('userInitials').textContent = initials;
    }
    displayInfor();

    const ROLE_LABELS = { staff: "Staff", user: "Customer" };
    const ROLE_COLORS = {
        staff: { bg: "#EAEEFB", text: "#3454D1" },
        user: { bg: "#ECECE8", text: "#4B4E57" }
    };

    let allUsers = [];

    function loadUsers() {
        fetch('http://localhost:5000/users/get_staffs_customers')
            .then(response => response.json())
            .then(data => {
                allUsers = data.users || [];
                renderStats();
                renderTable();
            })
            .catch(error => console.error('Error fetching users:', error));
    }

    function renderStats() {
        document.getElementById("stat-total").textContent = allUsers.length;
        document.getElementById("stat-staff").textContent = allUsers.filter((u) => u.role === "staff").length;
        document.getElementById("stat-users").textContent = allUsers.filter((u) => u.role === "user").length;
    }

    function renderTable() {
        const searchTerm = document.getElementById("staff-search").value.trim().toLowerCase();
        const roleFilter = document.getElementById("role-filter").value;

        const filtered = allUsers.filter((u) => {
            const matchesSearch = !searchTerm ||
                u.username.toLowerCase().includes(searchTerm) ||
                u.email.toLowerCase().includes(searchTerm);
            const matchesRole = !roleFilter || u.role === roleFilter;
            return matchesSearch && matchesRole;
        });

        const tbody = document.getElementById("user-table-body");
        tbody.innerHTML = "";

        filtered.forEach((u) => {
            const roleColor = ROLE_COLORS[u.role] || ROLE_COLORS.user;
            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.innerHTML = `<span class="ticket-subject">${u.username}</span>`;

            const emailCell = document.createElement("td");
            emailCell.style.color = "#4B4E57";
            emailCell.textContent = u.email;

            const roleCell = document.createElement("td");
            roleCell.innerHTML = `<span class="pill" style="background:${roleColor.bg};color:${roleColor.text};">${ROLE_LABELS[u.role] || u.role}</span>`;

            const joinedCell = document.createElement("td");
            joinedCell.style.color = "#4B4E57";
            joinedCell.textContent = u.created_at ? new Date(u.created_at).toLocaleDateString() : "—";

            const taskNumber = document.createElement('td');

            const staffCode = document.createElement('td');
            if (u.role === "user") {
                staffCode.textContent = "None";
            } else {
                staffCode.textContent = u.employee_code || "—";
            }
            row.appendChild(nameCell);
            row.appendChild(emailCell);
            row.appendChild(roleCell);
            row.appendChild(joinedCell);
            row.appendChild(taskNumber);
            row.appendChild(staffCode);
            tbody.appendChild(row);
        });
    }

    document.getElementById("staff-search").addEventListener("input", renderTable);
    document.getElementById("role-filter").addEventListener("change", renderTable);

    loadUsers();
</script>

</html>
