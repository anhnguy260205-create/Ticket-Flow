<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TicketFlow — Admin: all tickets</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="../css/homepage.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/authGuard.js"></script>
</head>

<body>
    <div style="min-height:100vh;box-sizing:border-box;background:#F7F7F5;display:flex;flex-direction:column;">

        <!-- Nav -->
        <div
            style="display:flex;align-items:center;justify-content:space-between;padding:20px 56px;background:#FFFFFF;border-bottom:1px solid #E3E3DD;flex-wrap:wrap;gap:16px;">
            <div style="display:flex;align-items:center;gap:48px;flex-wrap:wrap;">
                <a href="Dashboard.html" style="display:flex;align-items:center;gap:10px;">
                    <span
                        style="width:30px;height:30px;border-radius:8px;background:#3454D1;display:flex;align-items:center;justify-content:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </span>
                    <span
                        style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;">TicketFlow</span>
                </a>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a href="Dashboard.html"
                        style="font-size:14px;font-weight:600;color:#3454D1;background:#EAEEFB;padding:9px 16px;border-radius:8px;">All
                        tickets</a>
                    <a href="StaffManagement.html"
                        style="font-size:14px;font-weight:600;color:#4B4E57;padding:9px 16px;border-radius:8px;">Staff</a>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span id="userInitials"
                    style="width:36px;height:36px;border-radius:999px;background:#3454D1;color:#FFFFFF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;">MP</span>
                <div style="display:flex;flex-direction:column;line-height:1.3;">
                    <span id="userName" style="font-size:13px;font-weight:600;">Morgan Patel</span>
                    <span style="font-size:12px;color:#8A8D97;">Admin</span>
                </div>
                <button onclick="handleLogout()"
                    style="background:none;border:none;font-size:13px;font-weight:600;color:#B23131;padding:8px 12px;border-radius:8px;">Log
                    out</button>
            </div>
        </div>

        <!-- Content -->
        <div style="padding:36px 56px;display:flex;flex-direction:column;gap:22px;flex-grow:1;">
            <div style="display:flex;flex-direction:column;gap:6px;">
                <h1 style="font-size:26px;font-weight:700;">All tickets</h1>
                <p style="font-size:14px;color:#4B4E57;">Review, allocate, and track every ticket across the team.
                </p>
            </div>

            <!-- Stats -->
            <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;">
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Open</span>
                    <span id="stat-open"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#3454D1;"></span>
                </div>
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">In progress</span>
                    <span id="stat-in-progress"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#8A4B07;"></span>
                </div>
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Resolved this week</span>
                    <span id="stat-resolved"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#1B7A43;"></span>
                </div>
                <div
                    style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;">
                    <span style="font-size:13px;color:#4B4E57;font-weight:600;">Unassigned</span>
                    <span id="stat-unassigned"
                        style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#B23131;"></span>
                </div>
            </div>

            <!-- Filters -->
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div
                    style="flex-grow:1;display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #CBCBC2;border-radius:9px;padding:0 14px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="M21 21l-4.3-4.3"></path>
                    </svg>
                    <input type="text" placeholder="Search by ticket, customer, or keyword"
                        style="border:none;padding:11px 0;font-size:14px;flex-grow:1;">
                </div>
                <select
                    style="padding:0 14px;border-radius:9px;border:1px solid #CBCBC2;font-size:14px;background:#FFFFFF;">
                    <option>All categories</option>
                    <option>Billing</option>
                    <option>Technical</option>
                    <option>Account</option>
                    <option>Feature request</option>
                </select>
                <select
                    style="padding:0 14px;border-radius:9px;border:1px solid #CBCBC2;font-size:14px;background:#FFFFFF;">
                    <option>All priorities</option>
                    <option>Critical</option>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>

            <!-- Table -->
            <div style="background:#FFFFFF;border:1px solid #E3E3DD;border-radius:16px;overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Customer</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Assigned to</th>
                            <th>Submitted</th>
                            <th>Deadline</th>

                        </tr>
                    </thead>
                    <tbody id="ticket-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

</body>
<script>
    function handleLogout() {
        localStorage.removeItem('ticketflow_user');
        window.location.href = '../Login.html';
    }
    function displayInfor() {
        const infor = JSON.parse(localStorage.getItem('ticketflow_user'));
        document.getElementById('userName').textContent = infor.username
        const initials = infor.username.split(' ').map(word => word[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('userInitials').textContent = initials;
    }
    displayInfor();

    const STATUS_COLORS = {
        "Open": { bg: "#EAEEFB", text: "#3454D1" },
        "In Progress": { bg: "#FBEEDD", text: "#8A4B07" },
        "Resolved": { bg: "#E4F4EA", text: "#1B7A43" },
        "Closed": { bg: "#ECECE8", text: "#4B4E57" }
    };

    const PRIORITY_COLORS = {
        "Critical": { bg: "#FBEAEA", text: "#B23131" },
        "High": { bg: "#FBEEDD", text: "#8A4B07" },
        "Medium": { bg: "#EAEEFB", text: "#3454D1" },
        "Low": { bg: "#ECECE8", text: "#4B4E57" }
    };

    let STAFF_LIST = [];

    function loadStaff() {
        fetch('http://localhost:5000/users/get_all_users')
            .then(response => response.json())
            .then(data => {
                STAFF_LIST = (data.users || [])
                    .filter((u) => u.role === "staff")
                    .map((u) => u.username);
            })
            .catch(error => console.error('Error fetching staff:', error));
    }

    // backend enum values (model/ticket.py) <-> display labels used above
    const STATUS_TO_DISPLAY = { open: "Open", in_progress: "In Progress", resolved: "Resolved", closed: "Closed" };
    const STATUS_TO_BACKEND = { "Open": "open", "In Progress": "in_progress", "Resolved": "resolved", "Closed": "closed" };
    const PRIORITY_TO_DISPLAY = { low: "Low", medium: "Medium", high: "High", critical: "Critical" };

    let tickets = [];
    let openAllocateId = null;

    function loadTickets() {
        fetch('http://localhost:5000/tickets/get-all-tickets')
            .then(response => response.json())
            .then(data => {
                tickets = (data.tickets || []).map((t) => ({
                    ticketId: t.ticket_id,
                    id: `TF-${t.ticket_id}`,
                    subject: t.title,
                    customer: t.customer || `User #${t.user_id}`,
                    category: t.category,
                    priority: PRIORITY_TO_DISPLAY[t.priority] || t.priority,
                    status: STATUS_TO_DISPLAY[t.status] || t.status,
                    assignee: t.assigned_role && t.assigned_role !== "none" ? t.assigned_role : null,
                    date: t.created_at ? new Date(t.created_at).toLocaleDateString() : "",
                    deadline: t.sla_due_at ? new Date(t.sla_due_at).toLocaleDateString() : "—"
                }));
                renderStats();
                renderTable();
            })
            .catch(error => console.error('Error fetching tickets:', error));
    }

    function persistTicketUpdate(ticketId, body) {
        fetch(`http://localhost:5000/tickets/update-ticket/${ticketId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) console.error('Failed to update ticket:', data.error);
            })
            .catch(error => console.error('Error updating ticket:', error));
    }

    function renderStats() {
        document.getElementById("stat-open").textContent =
            tickets.filter((t) => t.status === "Open").length;
        document.getElementById("stat-in-progress").textContent =
            tickets.filter((t) => t.status === "In Progress").length;
        document.getElementById("stat-resolved").textContent =
            tickets.filter((t) => t.status === "Resolved").length;
        document.getElementById("stat-unassigned").textContent =
            tickets.filter((t) => !t.assignee).length;
    }

    function onStatusChange(ticketId, newStatus) {
        const t = tickets.find((t) => t.id === ticketId);
        t.status = newStatus;
        renderStats();
        renderTable();
        persistTicketUpdate(t.ticketId, { status: STATUS_TO_BACKEND[newStatus] || newStatus });
    }

    function toggleAllocate(ticketId) {
        openAllocateId = openAllocateId === ticketId ? null : ticketId;
        renderTable();
    }

    function assign(ticketId, name) {
        const t = tickets.find((t) => t.id === ticketId);
        t.assignee = name;
        openAllocateId = null;
        renderStats();
        renderTable();
        persistTicketUpdate(t.ticketId, { assigned_role: name });
    }

    function renderTable() {
        const tbody = document.getElementById("ticket-table-body");
        tbody.innerHTML = "";

        tickets.forEach((t) => {
            const statusColor = STATUS_COLORS[t.status];
            const priorityColor = PRIORITY_COLORS[t.priority];

            const row = document.createElement("tr");

            const subjectCell = document.createElement("td");
            subjectCell.innerHTML = `
                <span class="ticket-subject">${t.subject}</span><br>
                <span class="ticket-id">${t.id}</span>
            `;

            const customerCell = document.createElement("td");
            customerCell.style.color = "#4B4E57";
            customerCell.textContent = t.customer;

            const categoryCell = document.createElement("td");
            categoryCell.style.color = "#4B4E57";
            categoryCell.textContent = t.category;

            const priorityCell = document.createElement("td");
            priorityCell.innerHTML = `<span class="pill" style="background:${priorityColor.bg};color:${priorityColor.text};">${t.priority}</span>`;

            const statusCell = document.createElement("td");
            const select = document.createElement("select");
            select.className = "status-select";
            select.style.backgroundColor = statusColor.bg;
            select.style.color = statusColor.text;
            ["Open", "In Progress", "Resolved", "Closed"].forEach((status) => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                if (status === t.status) option.selected = true;
                select.appendChild(option);
            });
            select.addEventListener("change", (e) => onStatusChange(t.id, e.target.value));
            statusCell.appendChild(select);

            const assignCell = document.createElement("td");
            const wrap = document.createElement("div");
            wrap.className = "allocate-wrap";

            const allocateBtn = document.createElement("button");
            allocateBtn.className = "allocate-btn";
            allocateBtn.innerHTML = `
                ${t.assignee || "Allocate"}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A8D97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9l6 6 6-6"></path>
                </svg>
            `;
            allocateBtn.addEventListener("click", () => toggleAllocate(t.id));
            wrap.appendChild(allocateBtn);

            if (openAllocateId === t.id) {
                const menu = document.createElement("div");
                menu.className = "allocate-menu";
                STAFF_LIST.forEach((name) => {
                    const option = document.createElement("button");
                    option.className = "allocate-option";
                    option.textContent = name;
                    option.addEventListener("click", () => assign(t.id, name));
                    menu.appendChild(option);
                });
                wrap.appendChild(menu);
            }
            assignCell.appendChild(wrap);

            const dateCell = document.createElement("td");
            dateCell.style.color = "#4B4E57";
            dateCell.textContent = t.date;

            const deadlineCell = document.createElement("td");
            deadlineCell.style.color = "#4B4E57";
            deadlineCell.textContent = t.deadline;

            row.appendChild(subjectCell);
            row.appendChild(customerCell);
            row.appendChild(categoryCell);
            row.appendChild(priorityCell);
            row.appendChild(statusCell);
            row.appendChild(assignCell);
            row.appendChild(dateCell);
            row.appendChild(deadlineCell);
            tbody.appendChild(row);
        });
    }

    loadStaff();
    loadTickets();
</script>

</html>
