services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/backend
    environment:
      - DB_HOST=db
      - DB_USER=ticketflow
      - DB_PASSWORD=ticketflow_pass
      - DB_NAME=ticketflow_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=ticketflow_db
      - MYSQL_USER=ticketflow
      - MYSQL_PASSWORD=ticketflow_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
